name: Android Storage Auditor build and tests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/droidatlas-storage-auditor-v0.1
    paths:
      - 'tools/android-storage-auditor/**'
      - '.github/workflows/android-auditor.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/android-storage-auditor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK and install build tools
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CMD=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n1)
          test -x "$CMD"
          yes | "$CMD" --licenses > /dev/null || true
          "$CMD" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check generated APK and manifest
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          if grep -R --include='AndroidManifest.xml' 'android.permission.INTERNET' app/src; then
            echo 'Unexpected INTERNET permission' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DroidAtlas-Storage-Auditor-v0.1-debug-APK
          path: tools/android-storage-auditor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
